; Build with PlatformIO:  pio run -t upload && pio device monitor
; Or open pic_probe/pic_probe.ino in the Arduino IDE (board: ESP32 Dev Module).
[platformio]
src_dir = pic_probe

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
